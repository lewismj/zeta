name: Windows Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install boost-json:x64-windows boost-test:x64-windows qtbase:x64-windows qtsvg:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DZETA_BUILD_BENCHMARKS=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --target zeta-ui-holdem zeta_tests

      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build\zeta\test -C Release --output-on-failure
