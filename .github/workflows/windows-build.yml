name: Windows Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      - name: Install dependencies
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install boost-json:x64-windows boost-test:x64-windows qtbase:x64-windows qtsvg:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DZETA_BUILD_BENCHMARKS=OFF `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --target zeta-ui-holdem zeta-solve zeta_tests

      - name: Check generated lookup tables
        shell: pwsh
        run: |
          cmake --build build --config Release --target zeta-check-holdem-tables

      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build\zeta\test -C Release --output-on-failure
