name: Publish Release Bundle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update, for example v0.1.0
        required: true
        type: string
      run_id:
        description: Workflow run ID containing the uploaded bundle artifact
        required: true
        type: string
      artifact_name:
        description: Name of the workflow artifact to publish
        required: true
        default: zeta-holdem-solver-windows-x64
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Download bundle artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          gh run download $env:RUN_ID --name $env:ARTIFACT_NAME --dir artifacts

      - name: Publish GitHub Release bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundles = @(Get-ChildItem -Path artifacts -Filter '*.zip' -File -Recurse)
          if ($bundles.Count -ne 1) {
            throw "Expected exactly one zip bundle in the downloaded artifact, found $($bundles.Count)."
          }

          $bundle = $bundles[0].FullName
          if (gh release view $env:RELEASE_TAG 2>$null) {
            gh release upload $env:RELEASE_TAG $bundle --clobber
          } else {
            gh release create $env:RELEASE_TAG $bundle --title $env:RELEASE_TAG --generate-notes
          }
